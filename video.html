<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GENOMA // Video</title>
  <style>
    :root {
      --black: #000;
      --white: #fff;
      --line: 3px;
      --max: 1120px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
      background: var(--white);
      color: var(--black);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      text-transform: uppercase;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .shell {
      width: min(100%, var(--max));
      margin: 0 auto;
      padding: 18px;
    }

    header {
      border-bottom: var(--line) solid var(--black);
    }

    .top {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 7vw, 72px);
      line-height: 0.9;
      font-weight: 950;
    }

    .nav {
      display: flex;
      border: var(--line) solid var(--black);
    }

    .nav a {
      display: grid;
      place-items: center;
      min-height: 44px;
      padding: 10px 14px;
      border-right: 1px solid var(--black);
      font-size: 12px;
      font-weight: 950;
      text-align: center;
    }

    .nav a:last-child {
      border-right: 0;
    }

    .nav a:hover {
      background: var(--black);
      color: var(--white);
    }

    .video {
      margin-top: 18px;
      border: var(--line) solid var(--black);
      background: var(--black);
      aspect-ratio: 16 / 9;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    .meta {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      border: var(--line) solid var(--black);
      border-top: 0;
    }

    .meta a,
    .meta div {
      min-height: 48px;
      display: grid;
      place-items: center;
      padding: 10px;
      border-right: 1px solid var(--black);
      font-size: 12px;
      line-height: 1.2;
      font-weight: 950;
      text-align: center;
    }

    .meta a:last-child,
    .meta div:last-child {
      border-right: 0;
    }

    .meta a:hover {
      background: var(--black);
      color: var(--white);
    }

    @media (max-width: 720px) {
      .shell {
        padding: 12px;
      }

      .top {
        display: block;
      }

      .nav {
        margin-top: 14px;
      }

      .nav,
      .meta {
        display: grid;
        grid-template-columns: 1fr;
      }

      .nav a,
      .meta a,
      .meta div {
        border-right: 0;
        border-bottom: 1px solid var(--black);
      }

      .nav a:last-child,
      .meta a:last-child,
      .meta div:last-child {
        border-bottom: 0;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="shell top">
      <h1>VIDEO</h1>
      <nav class="nav" aria-label="Navigation">
        <a href="index.html">Hub</a>
        <a href="g2.html">G2</a>
        <a href="g1.html">G1</a>
      </nav>
    </div>
  </header>

  <main class="shell">
    <section class="video" aria-label="Project video">
      <iframe
        src="https://www.youtube.com/embed/d5u3zSgpqwc"
        title="Context Genetics Engine video"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen>
      </iframe>
    </section>
    <section class="meta" aria-label="Video links">
      <div>Context Genetics Engine</div>
      <a href="https://www.youtube.com/watch?v=d5u3zSgpqwc">Open YouTube</a>
      <a href="index.html">Back To Hub</a>
    </section>
  </main>
</body>
</html>
