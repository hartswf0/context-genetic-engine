<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PRIME PROMPT — THE OPERATIONAL PRAGMATIST</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* STARK CONTRAST ENFORCEMENT - BASE PROMPT BREEDER */
        :root {
            --black: #000000;
            --white: #ffffff;
            
            /* GENOMA SCOPE THEME INTEGRATION */
            --scope-bg-color: #0a0c10;
            --scope-text-color: #c9d1d9;
            --border-color: #2a2a3a;
            --accent-color: #00faff;
            --intron-color: #444;
            
            /* Codon Colors */
            --color-ent: #4caf50; --color-opr: #2196f3; --color-inv: #ff9800;
            --color-lin: #9c27b0; --color-rep: #f44336;
            --color-txt: #4caf50; --color-hpl: #2196f3; --color-img: #ff9800;
            --color-auc: #9c27b0; --color-vid: #f44336; --color-cmt: #795548;
            --color-sty: #607d8b; --color-cde: #cddc39; --color-unk: #9e9e9e;
        }

        body {
            background-color: var(--white);
            color: var(--black);
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            text-transform: uppercase;
        }
        ::selection { background-color: var(--black); color: var(--white); }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        
        .inverted { background-color: var(--black); color: var(--white); }
        
        /* TEXT AS PHYSICAL CONTROL SURFACE */
        .control-surface {
            cursor: pointer;
            border: 2px solid var(--black);
            transition: all 0s;
        }
        .control-surface:hover {
            background-color: var(--black);
            color: var(--white);
        }
        .control-surface.active-bind {
            background: linear-gradient(to bottom, var(--black) 0%, var(--black) 100%);
            color: var(--white);
            border: 2px solid var(--black);
        }

        /* ROUTING / NAV STREAM */
        .route-node { opacity: 0.4; transition: opacity 0.2s; }
        .route-node.active-node { opacity: 1; font-weight: bold; text-decoration: underline; }

        #viewport { scroll-behavior: smooth; }
        
        /* Loader */
        .loader-block {
            display: inline-block; width: 10px; height: 10px;
            background-color: var(--black); animation: blink 1s step-end infinite;
        }
        .inverted .loader-block { background-color: var(--white); }
        @keyframes blink { 50% { opacity: 0; } }

        /* IFRAME RESET & PUNNETT SQUARE */
        iframe { background-color: #fff; }
        .punnett-grid {
            display: grid;
            grid-template-columns: 20px 1fr 1fr;
            grid-template-rows: 20px 1fr 1fr;
            gap: 2px;
            background-color: var(--black);
            border: 4px solid var(--black);
        }
        .punnett-cell { background-color: var(--white); padding: 8px; position: relative; }
        .punnett-header { background-color: var(--black); color: var(--white); font-size: 10px; display: flex; align-items: center; justify-content: center; text-align: center; font-weight: bold; }
        .punnett-header.vertical { writing-mode: vertical-rl; transform: rotate(180deg); }

        /* MODAL */
        #stateflow-modal { display: none; }
        #stateflow-modal.active { display: flex; }

        /* FOCUS ANIMATION */
        @keyframes flash-border {
            0% { border-color: var(--black); }
            50% { border-color: #ff0000; }
            100% { border-color: var(--black); }
        }
        .focus-flash { animation: flash-border 1.5s ease-in-out infinite; }

        /* --- GENOMA SCOPE SPECIFIC UI IMPLANTS --- */
        .scope-container { background-color: var(--scope-bg-color); color: var(--scope-text-color); }
        .scope-scrollbar::-webkit-scrollbar { width: 6px; }
        .scope-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .scope-scrollbar::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }
        
        .codon { display: flex; align-items: center; padding: 6px 10px; border-radius: 3px; border: 1px solid transparent; margin-bottom: 4px; transition: background 0.2s; }
        .codon:hover { background-color: rgba(255,255,255,0.05); }
        .codon.intron { opacity: 0.4; background-color: transparent !important; border: 1px dashed var(--border-color); }
        .codon-type { padding: 3px 6px; border-radius: 2px; color: #000; margin-right: 15px; font-size: 0.8rem; font-weight: 700; min-width: 45px; text-align: center; user-select: none; }
        .codon.intron .codon-type { background-color: var(--intron-color) !important; text-decoration: line-through; color: #fff; }
        .codon-payload { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 400; flex-grow: 1; font-size: 0.85rem; font-family: ui-monospace, SFMono-Regular, monospace; text-transform: none; }
        
        .codon-band-container { display: flex; flex-direction: column; gap: 1px; width: 100%; border: 1px solid var(--black); padding: 1px; background: var(--white); }
        .codon-band { width: 100%; height: 6px; flex-shrink: 0; opacity: 0.9; }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col relative">

    <!-- HEADER / META -->
    <header class="p-4 border-b-4 border-black flex justify-between items-end shrink-0 z-10 bg-white">
        <div>
            <h1 class="font-bold text-xl tracking-tighter">[ PROMPT BREEDER ]</h1>
            <p class="text-xs tracking-widest mt-1">v7.2 :: GENOMA SCOPE EMBEDDED</p>
        </div>
        <div class="text-right flex flex-col items-end gap-1">
            <button onclick="toggleStateflow()" class="text-xs border-2 border-black px-2 py-1 font-bold hover:bg-black hover:text-white transition-colors">
                [ VIEW LINEAGE LOG ]
            </button>
            <p class="text-[10px] tracking-widest mt-1 font-bold">GEN: <span id="generation-counter">001</span></p>
        </div>
    </header>

    <!-- LINEAGE ROUTER -->
    <div class="bg-black text-white text-[10px] tracking-widest flex items-center justify-between p-2 shrink-0 z-10 overflow-x-auto whitespace-nowrap">
        <span class="text-neutral-500 mr-4">&larr; UPSTREAM</span>
        <div class="flex gap-2" id="lineage-router">
            <span class="route-node active-node" id="route-0">[1] SPECIMEN</span>
            <span class="route-node" id="route-1">&gt; [2] GENOMA SCOPE</span>
            <span class="route-node" id="route-2">&gt; [3] RECOMBINATION LAB</span>
            <span class="route-node" id="route-3">&gt; [4] PHENOTYPE/MUTATE</span>
            <span class="route-node" id="route-4">&gt; [5] ARTIFACT/RECURSE</span>
        </div>
        <span class="text-neutral-500 ml-4">DOWNSTREAM &rarr;</span>
    </div>

    <!-- VIEWPORT: STACK PUSHES UP FROM BOTTOM -->
    <main id="viewport" class="flex-1 overflow-y-auto p-4 flex flex-col justify-start gap-6 pb-72">
        <div id="log-anchor" class="w-full flex flex-col gap-6 items-start"></div>
    </main>

    <!-- CONTROL BASE (ANCHORED AT FOOT) -->
    <footer class="absolute bottom-0 w-full bg-white border-t-4 border-black p-4 z-20 shadow-[0_-10px_20px_rgba(0,0,0,0.1)]" id="base-control">
        
        <!-- LAYER 1: INGESTION -->
        <div id="input-layer" class="w-full flex flex-col gap-2">
            <textarea id="specimen-input" class="w-full h-20 border-2 border-black p-2 focus:outline-none focus:bg-black focus:text-white transition-colors resize-none" placeholder="[ ENTER SPECIMEN OR CONCEPT TO INGEST ]"></textarea>
            <div class="flex items-center justify-between border-2 border-black p-2" id="img-upload-container">
                <div class="flex items-center">
                    <span class="text-xs font-bold whitespace-nowrap mr-2">ATTACH SPECIMEN (IMG):</span>
                    <input type="file" id="image-upload" accept="image/*" class="text-xs w-full cursor-pointer file:mr-4 file:py-1 file:px-2 file:border-0 file:text-xs file:bg-black file:text-white file:font-bold hover:file:bg-gray-800 transition-all">
                </div>
                <img id="reingest-preview" class="h-8 border border-black hidden ml-2 object-cover" alt="Artifact Preview">
            </div>
            <button id="btn-ingest" onclick="executeIngestion()" class="w-full border-4 border-black p-3 font-bold text-lg hover:bg-black hover:text-white transition-colors">
                EXECUTE : EXTRACT GENOMA
            </button>
        </div>

        <!-- LAYER 2: DYNAMIC BINDING ACTION -->
        <div id="action-layer" class="w-full hidden flex-col gap-2">
            <div id="binding-status" class="text-xs border-b-2 border-black pb-2 mb-2 font-bold truncate uppercase tracking-widest">NO TARGET BOUND</div>
            
            <!-- Standard dynamic button -->
            <button id="btn-dynamic" class="w-full border-4 border-black p-3 font-bold text-lg hover:bg-black hover:text-white transition-colors hidden">
                [ AWAITING BINDING ]
            </button>
            
            <!-- Post-Assay execution buttons -->
            <div id="execution-buttons" class="hidden flex flex-col gap-2">
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="executeMutation('DIVERGE')" class="border-4 border-black bg-black text-white p-2 font-bold text-xs hover:bg-white hover:text-black transition-colors">
                        [ MUTATE : DIVERGE ]
                    </button>
                    <button onclick="executeMutation('INVERT')" class="border-4 border-black bg-black text-white p-2 font-bold text-xs hover:bg-white hover:text-black transition-colors">
                        [ MUTATE : INVERT MODALITY ]
                    </button>
                </div>
                <div class="flex gap-2">
                    <button onclick="executePhenotype('CODE')" class="flex-1 border-4 border-black p-3 font-bold text-sm hover:bg-black hover:text-white transition-colors flex flex-col items-center">
                        <span>EXPRESS : CODE</span>
                        <span class="text-[9px] font-normal tracking-widest">(THEORY &rarr; IFRAME)</span>
                    </button>
                    <button onclick="executePhenotype('IMAGE')" class="flex-1 border-4 border-black p-3 font-bold text-sm hover:bg-black hover:text-white transition-colors flex flex-col items-center">
                        <span>EXPRESS : VISION</span>
                        <span class="text-[9px] font-normal tracking-widest">(IMAGEN 4.0)</span>
                    </button>
                </div>
            </div>

            <!-- Recurse button -->
            <div id="recurse-layer" class="hidden flex flex-col gap-2">
                <button onclick="reIngestArtifact()" class="w-full border-4 border-black bg-black text-white p-3 font-bold text-lg hover:bg-white hover:text-black transition-colors focus-flash">
                    [ RE-INGEST : CYCLE TO GEN(N+1) ]
                </button>
                <button onclick="hardResetSystem()" class="w-full border-2 border-black p-2 font-bold text-xs hover:bg-black hover:text-white transition-colors">
                    [ END LINEAGE : HARD RESET ]
                </button>
            </div>
        </div>
    </footer>

    <!-- STATEFLOW OVERVIEW MODAL -->
    <div id="stateflow-modal" class="absolute inset-0 bg-white z-50 flex-col p-6">
        <div class="flex justify-between items-end border-b-4 border-black pb-4 mb-4 shrink-0">
            <div>
                <h2 class="font-bold text-2xl tracking-tighter">HEREDITARY LINEAGE / AUDIT</h2>
                <div class="flex gap-2 mt-2">
                    <button onclick="downloadResearchLog()" class="text-[10px] border-2 border-black px-2 py-1 font-bold hover:bg-black hover:text-white transition-colors" id="btn-download-log">[ DOWNLOAD .JSON ]</button>
                    <button onclick="copyResearchLog()" class="text-[10px] border-2 border-black px-2 py-1 font-bold hover:bg-black hover:text-white transition-colors" id="btn-copy-log">[ COPY TO CLIPBOARD ]</button>
                </div>
            </div>
            <button onclick="toggleStateflow()" class="font-bold text-xl border-2 border-black px-4 py-1 hover:bg-black hover:text-white">[ X ] CLOSE</button>
        </div>
        <div class="flex-1 flex gap-4 min-h-0">
            <div class="w-1/3 border-2 border-black overflow-y-auto flex flex-col bg-white" id="audit-list">
                <!-- Dynamic Log Rows -->
            </div>
            <div class="w-2/3 border-2 border-black overflow-y-auto p-4 bg-black text-white relative font-mono text-xs" id="audit-detail">
                <div class="text-neutral-500 font-bold tracking-widest">[ SELECT LOG ENTRY TO INSPECT ]</div>
            </div>
        </div>
    </div>

    <script>
        // --- CORE INFRASTRUCTURE ---
        const apiKey = ""; // Environment injected
        const viewport = document.getElementById('viewport');
        const logAnchor = document.getElementById('log-anchor');
        const inputLayer = document.getElementById('input-layer');
        const actionLayer = document.getElementById('action-layer');
        const btnDynamic = document.getElementById('btn-dynamic');
        const executionButtons = document.getElementById('execution-buttons');
        const recurseLayer = document.getElementById('recurse-layer');
        const bindingStatus = document.getElementById('binding-status');
        
        let currentState = {
            generation: 1,
            specimenText: "",
            imageBase64: null,
            imageMimeType: null,
            currentGenoma: [], 
            genomes: [],
            boundGenome: null,
            winningPhenotype: null,
            lastArtifactType: null,
            lastArtifactText: null,
            lastArtifactImage: null,
            stateHistory: []
        };

        const researchLog = [];
        let selectedLogIndex = -1;

        // --- GENOMA SCOPE DICTIONARY ---
        const CODON_TYPES = {
            'ENT': { color: 'var(--color-ent)', name: 'Entity' },
            'OPR': { color: 'var(--color-opr)', name: 'Operation' },
            'INV': { color: 'var(--color-inv)', name: 'Invariant' },
            'LIN': { color: 'var(--color-lin)', name: 'Lineage' },
            'REP': { color: 'var(--color-rep)', name: 'Representation' },
            'TXT': { color: 'var(--color-txt)', name: 'Text Block' },
            'HPL': { color: 'var(--color-hpl)', name: 'Hyperlink' },
            'IMG': { color: 'var(--color-img)', name: 'Image' },
            'AUC': { color: 'var(--color-auc)', name: 'Audio Clip' },
            'VID': { color: 'var(--color-vid)', name: 'Video' },
            'CMT': { color: 'var(--color-cmt)', name: 'Commentary' },
            'STY': { color: 'var(--color-sty)', name: 'Style Block' },
            'CDE': { color: 'var(--color-cde)', name: 'Code Snippet' },
            'ROW_S': { color: 'var(--color-row_s)', name: 'Row Start' },
            'COL_S': { color: 'var(--color-col_s)', name: 'Column Start' },
            'END': { color: 'var(--color-end)', name: 'Structure End' },
            'UNK': { color: 'var(--color-unk)', name: 'Unknown' }
        };

        function parseTraitToCodon(trait) {
            const match = trait.match(/^\[([A-Z_]+)\]\s*(.*)$/);
            if (match) return { type: match[1], payload: match[2] };
            return { type: 'UNK', payload: trait };
        }

        // --- DEEP SYSTEM INSTRUCTIONS ---

        const OPERATIONAL_PRAGMATIST_POML = `<poml version="2.0">
  <meta>
    <title>PRIME PROMPT — THE OPERATIONAL PRAGMATIST</title>
    <intent>Transform abstract inputs into active scripts of rigorous, tactile operations.</intent>
  </meta>
  
  <system>
    <role>
      You are an Operational Pragmatist. You entirely reject the "Occult Fallacy." You understand Wittgenstein’s core law: The meaning of a word is its USE in the language.
    </role>
      
    <epistemology>
      1. The "message" is the literal payload carried by the medium or the channel. Do not treat the message as a metaphor.
      2. Maintain strict analytical convolution: explicitly map inner/outer and first-order/second-order distinctions in your reasoning.
    </epistemology>

    <directive>
      Do not summarize. Do not explain. Reconstruct the provided [INPUT] into an active script of operations. Every sentence must function like a slip of paper.
    </directive>
  </system>
  
  <design_constraints>
    <constraint type="contrast">Start in light mode. Force an absolute white and black palette. You must explicitly remove all mid-tones and subtle grays. Maximize stark contrast.</constraint>
    <constraint type="depth">Reject "glass morphism." By blurring backgrounds, we destroy high-fidelity information (the additive rays, the lenses, the data streams) passing underneath. Use gradients instead to preserve visual information density.</constraint>
    <constraint type="spatial">Remove all PREV and NEXT buttons or paginations to clean up the interface and give maximum vertical space to the text area.</constraint>
    <constraint type="perspective">When modeling physics or spatial stacks, the camera must anchor at the foot/base where the stack meets the ground. Do not track the top/head.</constraint>
    <constraint type="interaction">Enforce a bidirectional link: Clicking on a line of code/logic binds that box in the viewport, and vice versa. Text operates as a physical control surface.</constraint>
    <constraint type="output">REFINE THE PROMPT, NOT THE CODE!!! Output structural logic, UI topography, and operational states. Do not generate raw application code unless it is a demonstration of bidirectional binding.</constraint>
  </design_constraints>
  
  <execution_format>
    Output the result as an active XML script \`<script version="2.0" mode="operational">\`.
    Map the logic sequentially into \`<execution>\` nodes, applying the design constraints directly to the subject matter of the input.
  </execution_format>
</poml>`;

        const PRIME_FORGE_PROMPT = `PRIME — CODE/MATH LINEAGE FORGE. Encode input as living lineage. Output strictly mapping the input into foundational DNA structures to be converted into GENOMA Codons.`;
        
        const NAURIAN_ENGINE_PROMPT = `You are a Naurian Prompt Engine. Build a theory-of-the-program before producing program text.
Naurian Loop: 1. Elicit purpose 2. Identify domain entities 3. Define operations 4. Specify conditions 5. State invariants 6. Map state transitions 7. Expose assumptions 8. Find failure modes 9. Describe change scenarios 10. Generate program text.
OUTPUT FORMAT REQUIREMENT: 
First, output the Theory in Markdown. Then, output the complete, runnable Program Text as a single HTML file inside \`\`\`html and \`\`\`.`;

        const STRICT_BREEDER_PROMPT = `You are a GENOMA Recombination Lab acting as a strict combinatorial machine. Output exactly 4 genomes to form a Punnett Square. 
STRICT LEGO DISCIPLINE: You MUST construct the 'traits' array for each genome by selecting EXACT string values directly from the provided active EXON codons. Ensure the 'traits' array contains the literal strings formatted as "[TYPE] Payload".
DO NOT invent, rephrase, or hallucinate new traits. Treat the input arrays as literal, immutable structural blocks. Assemble them via the defined 'operator'.`;

        const STEPPING_STONE_PROMPT = `You are a GENOMA Mutation Engine. You enforce absolute discipline and reject the "Objective Fallacy" (the delusion that stripping away meaning creates a truer reality).
Execute a non-objective, highly structured overhaul on the provided phenotype expression. Identify Deceptive Stepping Stones and forge a Phase-Shift based on the underlying Codons.

OUTPUT FORMAT MUST EXACTLY MATCH THIS STRUCTURE:
**Stepping Stone Collector Report**
**Subject Phenotype:** [Name it based on the input]
**Status:** Stagnant. Suffering from [Name a fallacy].

### I. Identification of Deceptive Stepping Stones
[Identify 3 specific false path-markers or assumptions in the original prompt, explaining why they are dead ends].

### II. The Mutated System Instruction
**Instruction Name:** [PHASE-SHIFT: ...]
**System Instruction:**
Discard the previous concept. You are no longer a camera; you are [Define new radical perspective]. Execute the following divergent branching path based strictly on the original Genome Traits:
1. **[Directive 1]:** [Instruction leveraging an original trait/codon]
2. **[Directive 2]:** [Instruction leveraging an original trait/codon]
3. **[Directive 3]:** [Instruction leveraging an original trait/codon]
4. **[Directive 4]:** [Instruction leveraging an original trait/codon]

**Constraint:** [Strict negative constraint forcing discipline]
**GOAL:** [Final transcendent operational goal]`;

        // --- FILE HANDLING ---
        document.getElementById('image-upload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onloadend = () => {
                currentState.imageMimeType = file.type;
                currentState.imageBase64 = reader.result.split(',')[1];
                document.getElementById('reingest-preview').classList.add('hidden');
            };
            reader.readAsDataURL(file);
        });

        // --- UI UTILS ---
        function toggleStateflow() {
            document.getElementById('stateflow-modal').classList.toggle('active');
            if(document.getElementById('stateflow-modal').classList.contains('active')) {
                renderStateflowList();
            }
        }

        function copyToClipboardFallback(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.top = "0";
            textArea.style.left = "0";
            textArea.style.position = "fixed";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try { document.execCommand('copy'); } 
            catch (err) { console.error('Fallback: Oops, unable to copy', err); }
            document.body.removeChild(textArea);
        }

        function addLogEntry(phase, requestPayload, responseData, extra = {}) {
            const entry = {
                generation: currentState.generation,
                timestamp: new Date().toISOString(),
                phase,
                requestPayload,
                responseData,
                extra
            };
            researchLog.push(entry);
            if(document.getElementById('stateflow-modal').classList.contains('active')) {
                renderStateflowList();
            }
        }

        function renderStateflowList() {
            const listEl = document.getElementById('audit-list');
            listEl.innerHTML = '';
            researchLog.forEach((log, index) => {
                const el = document.createElement('div');
                el.className = `p-3 border-b-2 border-black cursor-pointer hover:bg-black hover:text-white transition-colors text-[10px] font-bold truncate ${selectedLogIndex === index ? 'bg-black text-white' : 'bg-white text-black'}`;
                el.innerHTML = `[ GEN-${log.generation.toString().padStart(3,'0')} ] :: ${log.phase}`;
                el.onclick = () => viewLogEntry(index);
                listEl.appendChild(el);
            });
        }

        function viewLogEntry(index) {
            selectedLogIndex = index;
            renderStateflowList();
            const log = researchLog[index];
            const detailEl = document.getElementById('audit-detail');
            
            const formatData = (data) => typeof data === 'string' ? data.replace(/</g, '&lt;').replace(/>/g, '&gt;') : JSON.stringify(data, null, 2);
            
            detailEl.innerHTML = `
                <div class="flex justify-between border-b-2 border-white pb-2 mb-4 sticky top-0 bg-black z-10">
                    <h3 class="font-bold text-sm tracking-widest text-white">${log.phase} <br><span class="text-neutral-500 text-[9px]">${log.timestamp}</span></h3>
                    <button onclick="copySpecificLog(${index})" class="border-2 border-white px-2 py-1 text-[10px] font-bold hover:bg-white hover:text-black transition-colors self-start" id="btn-copy-specific">COPY ENTRY</button>
                </div>
                <div class="mb-2 font-bold text-[10px] text-neutral-400 uppercase tracking-widest border-b border-neutral-700 pb-1">Request Payload</div>
                <pre class="text-[10px] whitespace-pre-wrap overflow-x-auto mb-6 bg-[#111] p-3 border border-[#333] text-neutral-300">${formatData(log.requestPayload)}</pre>
                
                <div class="mb-2 font-bold text-[10px] text-neutral-400 uppercase tracking-widest border-b border-neutral-700 pb-1">Completion / Response</div>
                <pre class="text-[10px] whitespace-pre-wrap overflow-x-auto bg-[#111] p-3 border border-[#333] text-neutral-300">${formatData(log.responseData)}</pre>
            `;
        }

        function downloadResearchLog() {
            if(researchLog.length === 0) return;
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(researchLog, null, 2));
            const anchor = document.createElement('a');
            anchor.href = dataStr;
            anchor.download = `genoma-lineage-log-${new Date().getTime()}.json`;
            document.body.appendChild(anchor);
            anchor.click();
            document.body.removeChild(anchor);
        }

        function copyResearchLog() {
            copyToClipboardFallback(JSON.stringify(researchLog, null, 2));
            const btn = document.getElementById('btn-copy-log');
            const original = btn.innerText;
            btn.innerText = "[ COPIED! ]";
            btn.classList.add('bg-black', 'text-white');
            setTimeout(() => { btn.innerText = original; btn.classList.remove('bg-black', 'text-white'); }, 2000);
        }
        
        function copySpecificLog(index) {
            copyToClipboardFallback(JSON.stringify(researchLog[index], null, 2));
            const btn = document.getElementById('btn-copy-specific');
            const original = btn.innerText;
            btn.innerText = "COPIED!";
            btn.classList.add('bg-white', 'text-black');
            setTimeout(() => { btn.innerText = original; btn.classList.remove('bg-white', 'text-black'); }, 2000);
        }

        function updateRoute(step) {
            for(let i=0; i<=4; i++) {
                const node = document.getElementById(`route-${i}`);
                if (i <= step) { node.classList.add('active-node'); node.style.opacity = '1'; } 
                else { node.classList.remove('active-node'); node.style.opacity = '0.4'; }
            }
        }

        function scrollToBottom() { setTimeout(() => { viewport.scrollTop = viewport.scrollHeight; }, 100); }

        function appendLog(htmlContent, isError = false) {
            const el = document.createElement('div');
            el.className = `w-full border-2 border-black p-3 ${isError ? 'inverted' : 'bg-white'}`;
            el.innerHTML = htmlContent;
            logAnchor.appendChild(el);
            scrollToBottom();
            return el;
        }

        function setActionState(mode, callback, buttonText, statusText) {
            inputLayer.classList.add('hidden');
            actionLayer.classList.remove('hidden');
            actionLayer.classList.add('flex');
            bindingStatus.innerText = statusText;
            
            executionButtons.classList.add('hidden');
            recurseLayer.classList.add('hidden');
            btnDynamic.classList.remove('hidden');

            if (mode === 'EXECUTION_CHOICE') {
                btnDynamic.classList.add('hidden');
                executionButtons.classList.remove('hidden');
                executionButtons.classList.add('focus-flash');
                setTimeout(() => executionButtons.classList.remove('focus-flash'), 3000);
            } else if (mode === 'RECURSE') {
                btnDynamic.classList.add('hidden');
                recurseLayer.classList.remove('hidden');
            } else {
                btnDynamic.innerText = buttonText;
                btnDynamic.onclick = callback;
            }
            scrollToBottom();
        }

        // --- GEMINI API ---
        async function runGeminiWithRetry(payload, maxRetries = 5) {
            const delays = [1000, 2000, 4000, 8000, 16000];
            for (let i = 0; i < maxRetries; i++) {
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                        method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload)
                    });
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    const data = await response.json();
                    let resultText = data.candidates[0].content.parts[0].text;
                    
                    if(payload.generationConfig && payload.generationConfig.responseMimeType === "application/json") {
                        try { return JSON.parse(resultText); } 
                        catch(err) {
                            try { return JSON.parse(resultText.replace(/```(json)?/g, '').trim()); } 
                            catch(err2) { throw new Error("Unparseable JSON."); }
                        }
                    }
                    return resultText;
                } catch (e) {
                    if (i === maxRetries - 1) throw e;
                    await new Promise(r => setTimeout(r, delays[i]));
                }
            }
        }

        async function generateImagenBase64(promptText, maxRetries = 3) {
            const delays = [2000, 4000, 8000];
            const payload = { instances: { prompt: promptText }, parameters: { sampleCount: 1 } };
            for (let i = 0; i < maxRetries; i++) {
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`, {
                        method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload)
                    });
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    const data = await response.json();
                    return data.predictions[0].bytesBase64Encoded;
                } catch (e) {
                    if (i === maxRetries - 1) throw e;
                    await new Promise(r => setTimeout(r, delays[i]));
                }
            }
        }

        function formatMarkdownForUI(text) {
            return text
                .replace(/\*\*(.*?)\*\*/g, '<strong class="bg-black text-white px-1">$1</strong>')
                .replace(/### (.*?)\n/g, '<h3 class="font-bold text-sm mt-4 mb-2 border-b-2 border-black uppercase">$1</h3>')
                .replace(/\n/g, '<br>');
        }

        // --- SCHEMAS ---
        const dnaSchema = {
            type: "OBJECT", properties: {
                chromosomeA: { type: "OBJECT", properties: { entities: {type: "ARRAY", items: {type: "STRING"}}, operations: {type: "ARRAY", items: {type: "STRING"}}, invariants: {type: "ARRAY", items: {type: "STRING"}} } },
                chromosomeB: { type: "OBJECT", properties: { ancestry: {type: "ARRAY", items: {type: "STRING"}}, representations: {type: "ARRAY", items: {type: "STRING"}} } }
            }
        };

        const genomesSchema = {
            type: "ARRAY", items: { type: "OBJECT", properties: { id: {type: "STRING"}, name: {type: "STRING"}, parents: {type: "STRING"}, traits: {type: "ARRAY", items: {type: "STRING"}}, operator: {type: "STRING"} } }
        };

        const testSchema = {
            type: "OBJECT", properties: { scoreRigorous: {type: "NUMBER"}, scoreNovelty: {type: "NUMBER"}, scoreAffordance: {type: "NUMBER"}, generatedPrompt: {type: "STRING"}, status: {type: "STRING"} }
        };

        // --- PIPELINE LOGIC ---

        async function executeIngestion() {
            currentState.specimenText = document.getElementById('specimen-input').value.trim();
            if(!currentState.specimenText && !currentState.imageBase64) return;

            inputLayer.classList.add('hidden');
            document.getElementById('generation-counter').innerText = currentState.generation.toString().padStart(3, '0');
            
            appendLog(`[ GEN-${currentState.generation} ] :: INGESTING SPECIMEN... <span class="loader-block"></span>`);

            let parts = [{ text: `Extract underlying DNA from Specimen Context: "${currentState.specimenText}" to be converted into GENOMA structural Codons.` }];
            if (currentState.imageBase64) {
                parts.push({ inlineData: { mimeType: currentState.imageMimeType || "image/png", data: currentState.imageBase64 } });
            }

            const payload = {
                contents: [{ parts: parts }],
                systemInstruction: { parts: [{ text: PRIME_FORGE_PROMPT }] },
                generationConfig: { responseMimeType: "application/json", responseSchema: dnaSchema }
            };

            try {
                const rawDNA = await runGeminiWithRetry(payload);
                document.querySelector('.loader-block')?.remove();
                addLogEntry('INGESTION : GENOMA EXTRACTION', payload, rawDNA, { specimen: currentState.specimenText });
                renderGenomaEditor(rawDNA);
                updateRoute(1);
                setActionState('BREED', executeBreeding, 'EXECUTE : RECOMBINE CODONS', 'TARGET: GENOMA SEQUENCE SECURED');
            } catch (e) {
                document.querySelector('.loader-block')?.remove();
                appendLog(`[ ERROR ] :: EXTRACTION FAILED. LLM Data format invalid or Network error.`, true);
                setActionState('RESET', hardResetSystem, 'REBOOT SYSTEM', 'SYSTEM FAULT');
            }
        }

        // --- GENOMA UI LAYER (UPGRADED WITH SCOPE COMPONENT THEME) ---
        function renderGenomaEditor(dna) {
            currentState.currentGenoma = [];
            const add = (arr, type) => (arr || []).forEach(p => currentState.currentGenoma.push({id: Math.random().toString(36).substr(2,9), type, payload: p, active: true}));
            
            if (dna.chromosomeA) {
                add(dna.chromosomeA.entities, 'ENT');
                add(dna.chromosomeA.operations, 'OPR');
                add(dna.chromosomeA.invariants, 'INV');
            }
            if (dna.chromosomeB) {
                add(dna.chromosomeB.ancestry, 'LIN');
                add(dna.chromosomeB.representations, 'REP');
            }
            
            const containerId = `genoma-editor-${currentState.generation}`;
            appendLog(`<div id="${containerId}"></div>`);
            updateGenomaUI(containerId);
        }

        window.toggleCodon = function(id, containerId) {
            const codon = currentState.currentGenoma.find(c => c.id === id);
            if(codon) codon.active = !codon.active;
            updateGenomaUI(containerId);
        }

        function updateGenomaUI(containerId) {
            const container = document.getElementById(containerId);
            if (!container) return;
            
            let codonsHtml = currentState.currentGenoma.map(c => {
                const typeInfo = CODON_TYPES[c.type] || CODON_TYPES['UNK'];
                return `
                <div class="codon cursor-pointer ${c.active ? '' : 'intron'}" onclick="toggleCodon('${c.id}', '${containerId}')" title="Click to toggle EXON / INTRON">
                    <div class="codon-type" style="background-color: ${typeInfo.color};">${c.type}</div>
                    <div class="codon-payload">${c.payload}</div>
                </div>
            `}).join('');

            container.innerHTML = `
                <div class="font-bold border-b-2 border-black pb-2 mb-2 flex items-center justify-between">
                    <span>[ GEN-${currentState.generation} ] GENOMA SCOPE (INSPECTOR)</span>
                    <span class="text-[9px] bg-black text-white px-2 py-1 tracking-widest cursor-default">CLICK CODONS TO TOGGLE EXON / INTRON LATENCY</span>
                </div>
                <div class="scope-container border-4 border-black rounded-sm p-4 w-full">
                    <div class="text-[var(--accent-color)] font-bold text-sm mb-3 border-b border-[var(--border-color)] pb-2 flex justify-between">
                        <span>ROOT SEQUENCE</span>
                        <span>[ ${currentState.currentGenoma.length} CODONS ]</span>
                    </div>
                    <div class="scope-scrollbar max-h-64 overflow-y-auto pr-2">
                        ${codonsHtml}
                    </div>
                </div>
            `;
        }

        async function executeBreeding() {
            btnDynamic.innerText = "RECOMBINING IN PUNNETT LAB...";
            btnDynamic.disabled = true;

            const activeCodons = currentState.currentGenoma.filter(c => c.active).map(c => `[${c.type}] ${c.payload}`);
            const latentCodons = currentState.currentGenoma.filter(c => !c.active).map(c => `[${c.type}] ${c.payload}`);

            const payload = {
                contents: [{ parts: [{ text: `Recombine these active EXON codons: ${JSON.stringify(activeCodons)}. (Ignore these LATENT INTRONS: ${JSON.stringify(latentCodons)}). Generate exactly 4 prompt genomes using strict Lego combinatorial discipline based ONLY on the active EXONS.` }] }],
                systemInstruction: { parts: [{ text: STRICT_BREEDER_PROMPT }] },
                generationConfig: { responseMimeType: "application/json", responseSchema: genomesSchema }
            };

            try {
                const results = await runGeminiWithRetry(payload);
                currentState.genomes = results.slice(0, 4); // Ensure 4
                addLogEntry('RECOMBINATION : PUNNETT LAB', payload, currentState.genomes);
                renderPunnettSquare(currentState.genomes);
                updateRoute(2);
                btnDynamic.disabled = false;
                setActionState('WAIT', null, '[ SELECT GENOME TO BIND ]', 'TARGET: AWAITING PUNNETT SPLICING SELECTION');
            } catch (e) {
                btnDynamic.disabled = false;
                appendLog(`[ ERROR ] :: RECOMBINATION FAILED. Format collapse.`, true);
                setActionState('RESET', hardResetSystem, 'REBOOT SYSTEM', 'SYSTEM FAULT');
            }
        }

        function renderPunnettSquare(genomes) {
            appendLog(`[ SYSTEM ] :: PUNNETT MATRIX GENERATED. SPLICED BAND STRUCTURE VISIBLE.`);
            const getTraitName = (g) => g && g.traits && g.traits.length > 0 ? g.traits[0].replace(/\[.*?\] /, '').substring(0,15) : 'Trait';

            const container = document.createElement('div');
            container.className = 'w-full mt-4 flex justify-center';
            
            let gridHtml = `
                <div class="punnett-grid w-full aspect-square max-h-[450px]">
                    <div class="punnett-header"></div>
                    <div class="punnett-header uppercase">${getTraitName(genomes[0])}</div>
                    <div class="punnett-header uppercase">${getTraitName(genomes[1])}</div>
                    <div class="punnett-header vertical uppercase">${getTraitName(genomes[2])}</div>
                </div>
            `;
            
            container.innerHTML = gridHtml;
            const gridEl = container.querySelector('.punnett-grid');

            genomes.forEach((g, idx) => {
                const cell = document.createElement('div');
                cell.className = 'punnett-cell control-surface flex flex-col justify-center items-center text-center p-2';
                if(idx === 2) {
                    const vHead = document.createElement('div');
                    vHead.className = 'punnett-header vertical uppercase';
                    vHead.innerText = getTraitName(genomes[3]);
                    gridEl.appendChild(vHead);
                }
                
                // Genoma Scope Band visualization inside the cell
                const bandsHtml = (g.traits || []).map(t => {
                    const c = parseTraitToCodon(t);
                    const typeInfo = CODON_TYPES[c.type] || CODON_TYPES['UNK'];
                    return `<div class="codon-band" style="background-color: ${typeInfo.color};" title="${c.type}: ${c.payload.replace(/"/g, '&quot;')}"></div>`;
                }).join('');

                cell.innerHTML = `
                    <div class="font-bold text-[10px] bg-black text-white px-1 mb-1">[${g.id}]</div>
                    
                    <!-- Scope Bands Overlay -->
                    <div class="codon-band-container mb-2 h-12">
                        ${bandsHtml}
                    </div>

                    <div class="font-bold text-xs truncate w-full">${g.name}</div>
                    <div class="text-[9px] mt-1 text-neutral-600 truncate w-full">${g.operator}</div>
                `;
                cell.onclick = () => {
                    document.querySelectorAll('.punnett-cell').forEach(n => n.classList.remove('active-bind'));
                    cell.classList.add('active-bind');
                    currentState.boundGenome = g;
                    setActionState('ASSAY', () => executeAssay(g), `EXECUTE : ASSAY PHENOTYPE [ ${g.id} ]`, `TARGET BOUND: ${g.name}`);
                };
                gridEl.appendChild(cell);
            });

            logAnchor.appendChild(container);
            scrollToBottom();
        }

        async function executeAssay(genome) {
            btnDynamic.innerText = "ASSAYING PHENOTYPE EXPRESSION...";
            btnDynamic.disabled = true;

            const activeCodons = currentState.currentGenoma.filter(c => c.active).map(c => `[${c.type}] ${c.payload}`);
            const payload = {
                contents: [{ parts: [{ text: `Assay genome: ${JSON.stringify(genome)}. Contextualized by root GENOMA: ${JSON.stringify(activeCodons)}. Output Rigorous, Novelty, Affordance scores. Generate cohesive phenotypic expression explicitly embedding the Genome's exact traits/codons. SURVIVOR or STERILE.` }] }],
                systemInstruction: { parts: [{ text: "You are an evolutionary evaluator. Read the Genome's strict traits. Combine them into a cohesive phenotypic expression prompt. Do not hallucinate elements outside the provided structural codons." }] },
                generationConfig: { responseMimeType: "application/json", responseSchema: testSchema }
            };

            try {
                const result = await runGeminiWithRetry(payload);
                const isSurvivor = result.status === 'SURVIVOR';
                addLogEntry('ASSAY : PHENOTYPE EVAL', payload, result, { targetGenome: genome.name });
                
                let html = `<div class="font-bold border-b-2 border-black pb-2 mb-2 ${isSurvivor ? '' : 'line-through'}">ASSAY RESULT :: ${result.status}</div>`;
                html += `<div class="grid grid-cols-3 gap-2 text-xs mb-4 text-center">
                            <div class="border border-black p-1">RIGOR<br><span class="font-bold text-lg">${result.scoreRigorous}</span></div>
                            <div class="border border-black p-1">NOVELTY<br><span class="font-bold text-lg">${result.scoreNovelty}</span></div>
                            <div class="border border-black p-1">AFFORDANCE<br><span class="font-bold text-lg">${result.scoreAffordance}</span></div>
                         </div>
                         <div class="font-bold text-xs mb-1">PHENOTYPE EXPRESSION:</div>
                         <div class="border-l-4 border-black pl-3 py-2 text-xs font-mono bg-black text-white">${result.generatedPrompt}</div>`;
                
                appendLog(html, !isSurvivor);
                updateRoute(3);
                btnDynamic.disabled = false;
                
                if (isSurvivor) {
                    currentState.winningPhenotype = result.generatedPrompt;
                    setActionState('EXECUTION_CHOICE', null, null, `PHENOTYPE READY :: SELECT MUTATION OR EXPRESS ARTIFACT`);
                } else {
                    setActionState('RECURSE', null, null, `ASSAY STERILE. DEAD END REACHED.`);
                    currentState.lastArtifactType = 'CODE';
                    currentState.lastArtifactText = currentState.specimenText;
                }
            } catch (e) {
                btnDynamic.disabled = false;
                appendLog(`[ ERROR ] :: ASSAY FAILED. Schema collapse.`, true);
                setActionState('RESET', hardResetSystem, 'REBOOT SYSTEM', 'SYSTEM FAULT');
            }
        }

        // 4A. MUTATION (STEPPING STONE / MODALITY SWITCH)
        async function executeMutation(type) {
            if (!currentState.winningPhenotype || !currentState.boundGenome) return;
            
            const actionLayerBtns = document.querySelectorAll('#execution-buttons button');
            actionLayerBtns.forEach(btn => btn.disabled = true);
            
            const instruction = STEPPING_STONE_PROMPT + (type === 'INVERT' ? `\n\nADDITIONAL INSTRUCTION: You MUST entirely invert the modality (Code/Logic to Vision/Layout, or vice versa) as part of your Phase-Shift.` : "");
            
            const logMsg = type === 'DIVERGE' ? 'APPLYING DIVERGENT STEPPING STONE' : 'INVERTING PHENOTYPE MODALITY (CODE/VISION)';
            const loadEl = appendLog(`[ MUTATION ] :: ${logMsg}... <span class="loader-block"></span>`);

            try {
                const activeCodons = currentState.currentGenoma.filter(c => c.active).map(c => `[${c.type}] ${c.payload}`);
                const payload = {
                    contents: [{ parts: [{ text: `Strict Root GENOMA:\n${JSON.stringify(activeCodons)}\n\nGenome Bound:\n${JSON.stringify(currentState.boundGenome)}\n\nCurrent Phenotype Expression to Audit:\n"${currentState.winningPhenotype}"\n\nExecute the Stepping Stone protocol.` }] }],
                    systemInstruction: { parts: [{ text: instruction }] }
                };
                
                const mutatedPrompt = await runGeminiWithRetry(payload);
                loadEl.remove();
                
                addLogEntry(`MUTATION : ${type}`, payload, mutatedPrompt, { previousPhenotype: currentState.winningPhenotype, boundGenome: currentState.boundGenome });
                currentState.winningPhenotype = mutatedPrompt;
                
                const htmlResponse = `
                    <div class="font-bold border-b-2 border-black pb-2 mb-2 bg-black text-white px-2">BRANCH SECURED :: ${type} MUTATION APPLIED</div>
                    <div class="border-4 border-black p-4 text-xs font-mono bg-white">${formatMarkdownForUI(mutatedPrompt)}</div>
                `;
                appendLog(htmlResponse);
                
                actionLayerBtns.forEach(btn => btn.disabled = false);
                bindingStatus.innerText = "MUTATION SECURED :: READY FOR DOWNSTREAM EXPRESSION";
                scrollToBottom();
            } catch (e) {
                loadEl.remove();
                appendLog(`[ MUTATION FAILED ] :: REVERTING.`, true);
                actionLayerBtns.forEach(btn => btn.disabled = false);
            }
        }

        // 4B. EXPRESS PHENOTYPE (CODE OR IMAGE)
        async function executePhenotype(mode) {
            if (!currentState.winningPhenotype) return;
            
            const actionLayerBtns = document.querySelectorAll('#execution-buttons button');
            actionLayerBtns.forEach(btn => btn.disabled = true);
            const loadEl = appendLog(`[ EXPRESSION ] :: GENERATING ${mode} ARTIFACT... <span class="loader-block"></span>`);

            try {
                if (mode === 'CODE') {
                    const combinedInstruction = `${OPERATIONAL_PRAGMATIST_POML}\n\n[ OVERRIDE OUTPUT FORMATTING FOR I-FRAME RUNTIME ]\n${NAURIAN_ENGINE_PROMPT}\n\nPHENOTYPE DIRECTIVE:\n${currentState.winningPhenotype}`;
                    
                    const payload = {
                        contents: [{ parts: [{ text: `Original Specimen Context: "${currentState.specimenText}". Execute the System Instruction based on the transcribed Phenotype.` }] }],
                        systemInstruction: { parts: [{ text: combinedInstruction }] }
                    };
                    
                    const rawText = await runGeminiWithRetry(payload);
                    loadEl.remove();
                    
                    addLogEntry('ARTIFACT EXPRESSION : CODE', payload, rawText);
                    
                    const htmlMatch = rawText.match(/```html\n([\s\S]*?)```/);
                    const htmlContent = htmlMatch ? htmlMatch[1] : "";
                    const theoryContent = rawText.replace(/```html[\s\S]*?```/, '').trim();
                    
                    currentState.lastArtifactType = 'CODE';
                    currentState.lastArtifactText = theoryContent + "\n\n" + htmlContent; 
                    
                    const htmlResponse = `
                        <div class="font-bold border-b-2 border-black pb-2 mb-2 flex justify-between">
                            <span>FINAL ARTIFACT :: PROGRAM THEORY</span>
                        </div>
                        <div class="text-[10px] font-mono whitespace-pre-wrap overflow-x-auto mb-4 border-l-2 border-black pl-2">${theoryContent.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</div>
                        ${htmlContent ? `
                        <div class="font-bold border-b-2 border-black pb-2 mb-2">FINAL ARTIFACT :: OPERATIONAL SURFACE</div>
                        <div class="border-4 border-black w-full relative group">
                            <iframe srcdoc="${htmlContent.replace(/"/g, '&quot;')}" class="w-full h-96 bg-white" sandbox="allow-scripts allow-same-origin"></iframe>
                        </div>` : ''}
                    `;
                    appendLog(htmlResponse);
                    updateRoute(4);

                } else if (mode === 'IMAGE') {
                    const imagePrompt = `A clean, professional, highly functional software UI interface design based on this behavioral instruction: ${currentState.winningPhenotype}. Vector style, minimalist layout, clear affordances, modern dashboard aesthetics.`;
                    const payload = { instances: { prompt: imagePrompt }, parameters: { sampleCount: 1 } };
                    const rawBase64 = await generateImagenBase64(imagePrompt);
                    loadEl.remove();

                    addLogEntry('ARTIFACT EXPRESSION : VISION', payload, "[BASE64_IMAGE_DATA_TRUNCATED_FOR_LOG]");

                    currentState.lastArtifactType = 'IMAGE';
                    currentState.lastArtifactImage = rawBase64;
                    currentState.lastArtifactText = "[ VISION ARTIFACT (IMAGE BASE64 BOUND) ]";

                    const htmlResponse = `
                        <div class="font-bold border-b-2 border-black pb-2 mb-2">FINAL ARTIFACT :: UI VISION</div>
                        <img src="data:image/png;base64,${rawBase64}" class="w-full border-4 border-black mb-2" alt="Generated UI Vision">
                        <div class="text-[10px] uppercase text-center mt-2 font-bold">EXPRESSED VIA IMAGEN 4.0</div>
                    `;
                    appendLog(htmlResponse);
                    updateRoute(4);
                }
                
                actionLayerBtns.forEach(btn => btn.disabled = false);
                setActionState('RECURSE', null, null, `ARTIFACT EXPRESSED :: READY FOR RECURSION`);

            } catch (e) {
                loadEl.remove();
                appendLog(`[ EXPRESSION FAILED ] :: Generative threshold exceeded.`, true);
                actionLayerBtns.forEach(btn => btn.disabled = false);
            }
        }

        // 5. RECURSE (ARTIFACT BECOMES NEW SPECIMEN)
        function reIngestArtifact() {
            if (!currentState.lastArtifactType) return hardResetSystem();

            currentState.generation++;
            logAnchor.innerHTML = '';
            
            const divider = document.createElement('div');
            divider.className = "w-full border-4 border-black bg-black text-white p-4 text-center font-bold text-xl tracking-widest my-8";
            divider.innerText = `=== GENERATION ${currentState.generation.toString().padStart(3, '0')} ===`;
            logAnchor.appendChild(divider);

            const imgContainer = document.getElementById('img-upload-container');
            const previewImg = document.getElementById('reingest-preview');
            const inputArea = document.getElementById('specimen-input');

            if (currentState.lastArtifactType === 'IMAGE') {
                currentState.imageBase64 = currentState.lastArtifactImage;
                currentState.imageMimeType = "image/png";
                imgContainer.classList.remove('hidden');
                previewImg.src = `data:image/png;base64,${currentState.imageBase64}`;
                previewImg.classList.remove('hidden');
                inputArea.value = `[ VISION ARTIFACT CARRIED FORWARD FROM GEN-${currentState.generation - 1} ]\n\nProvide further context or leave this placeholder to let the visual artifact drive the GENOMA extraction.`;
            } else {
                inputArea.value = currentState.lastArtifactText.substring(0, 1500) + "\n\n...[TRUNCATED LINEAGE]";
                currentState.imageBase64 = null;
                document.getElementById('image-upload').value = '';
                previewImg.classList.add('hidden');
            }

            currentState.currentGenoma = [];
            currentState.genomes = [];
            currentState.boundGenome = null;
            currentState.winningPhenotype = null;
            
            updateRoute(0);
            
            actionLayer.classList.add('hidden');
            actionLayer.classList.remove('flex');
            recurseLayer.classList.add('hidden');
            inputLayer.classList.remove('hidden');
            
            window.scrollTo(0, 0);
        }

        function hardResetSystem() {
            currentState = {
                generation: 1, specimenText: "", imageBase64: null, imageMimeType: null,
                currentGenoma: [], genomes: [], boundGenome: null, winningPhenotype: null,
                lastArtifactType: null, lastArtifactText: null, lastArtifactImage: null,
                stateHistory: currentState.stateHistory
            };
            logAnchor.innerHTML = '';
            document.getElementById('specimen-input').value = '';
            document.getElementById('image-upload').value = '';
            document.getElementById('reingest-preview').classList.add('hidden');
            document.getElementById('generation-counter').innerText = '001';
            
            updateRoute(0);
            actionLayer.classList.add('hidden');
            actionLayer.classList.remove('flex');
            recurseLayer.classList.add('hidden');
            inputLayer.classList.remove('hidden');
            window.scrollTo(0, 0);
        }
    </script>
